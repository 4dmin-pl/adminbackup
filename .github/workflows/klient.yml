# AdminBackup klient Windows: oficjalny MSI UrBackup (weryfikowany SHA-256) -> marka A.D.M.I.N -> nasz MSI.
# Binarki nie są zmieniane, więc oryginalne podpisy cyfrowe autora zostają ważne.
name: AdminBackup klient

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["brand.py", "grafika/**", "installer/**", ".github/workflows/klient.yml"]
    tags: ["v*"]

env:
  URBACKUP_VERSION: "2.5.32"
  URBACKUP_MSI_SHA256: "f1d18e164bb69036aa9f4ca62d6e947c7c1859f98035230c73dbe906a17692aa"

jobs:
  msi:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz oficjalny MSI i sprawdź SHA-256
        run: |
          $u = "https://hndl.urbackup.org/Client/$env:URBACKUP_VERSION/UrBackup%20Client%20$env:URBACKUP_VERSION%28x64%29.msi"
          Invoke-WebRequest -Uri $u -OutFile upstream.msi
          $h = (Get-FileHash upstream.msi -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:URBACKUP_MSI_SHA256) { throw "SHA-256 nie pasuje: $h" }

      - name: Rozpakuj (instalacja administracyjna, bez instalowania)
        run: |
          $p = Start-Process msiexec.exe -ArgumentList '/a', "$PWD\upstream.msi", '/qn', "TARGETDIR=$PWD\extracted" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item -Recurse extracted\PFiles\UrBackup build\staging

      - name: Nałóż markę
        run: |
          pip install pillow resvg-py polib
          python brand.py klient build\staging build\brand

      - name: Zbuduj MSI
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.Firewall.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          wix build installer\adminbackup.wxs -arch x64 -culture pl-PL `
            -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -ext WixToolset.UI.wixext `
            -d Version=$env:URBACKUP_VERSION -d Staging=$PWD\build\staging -d CrtDir=$PWD\extracted\System64 -d Brand=$PWD\build\brand `
            -o out\AdminBackup-$env:URBACKUP_VERSION-x64.msi
          Remove-Item out\*.wixpdb
          # stała nazwa pod link na stronie: .../releases/latest/download/AdminBackup-x64.msi
          Copy-Item out\AdminBackup-$env:URBACKUP_VERSION-x64.msi out\AdminBackup-x64.msi
          Get-FileHash out\*.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AdminBackup-klient
          path: out

      - name: Wydanie publiczne (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
