# AdminBackup Server: obraz Docker (oficjalny UrBackup Server + marka) -> ghcr.io/4dmin-pl/adminbackup-server (publiczny)
name: AdminBackup serwer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["brand.py", "grafika/**", "serwer/**", ".github/workflows/serwer.yml"]
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Grafiki panelu
        run: |
          pip install pillow resvg-py polib
          python brand.py serwer serwer/www

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: serwer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/4dmin-pl/adminbackup-server:2.5
            ghcr.io/4dmin-pl/adminbackup-server:latest
