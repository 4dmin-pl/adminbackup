# AdminBackup - konfiguracja klienta (A.D.M.I.N, 4dmin.pl). Ta pierwsza linia musi zostać komentarzem.
#
# Użycie: zmień nazwę na adminbackup.ini, uzupełnij i połóż w TYM SAMYM folderze co AdminBackup-x64.msi.
# Instalator skopiuje plik, usługa wczyta go przy pierwszym starcie i usunie (razem z kluczem).
# Serwer w tej samej sieci LAN co komputer? Ten plik NIE jest potrzebny - klient znajdzie serwer sam.
#
# Dane bierzesz z panelu serwera klienta: Status -> „Dodaj nowego klienta internetowego”
# (nazwa komputera + klucz uwierzytelniający). Format: klucz=wartość, bez spacji wokół „=”.

internet_mode_enabled=true
internet_server=backup.firma-klienta.pl
internet_server_port=55415
computername=NAZWA-KOMPUTERA
internet_authkey=WKLEJ-KLUCZ-Z-PANELU
